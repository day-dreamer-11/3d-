[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:streamlit]
command=streamlit run factory_app.py --server.address 127.0.0.1 --server.port 8502 --server.headless true --server.fileWatcherType none --server.enableCORS false --server.enableXsrfProtection true
directory=/app
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/tmp",PYTHONUNBUFFERED="1"

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
